      <div class="grow"><p class="ttl ell">${esc(a.testTitle)}</p><div class="meta">${r ? esc(r.title) + '<span class="dot">·</span>' : ''}${fmtDate(a.finishedAt)}</div></div>${ico('chevR', 'chev')}</div></div>`; }).join('')}</div>`
    : `<div class="cal-empty">${L('Вы ещё не проходили тесты.', 'You haven’t taken any tests yet.', 'Сіз әлі тест тапсырған жоқсыз.')}</div>`;
  return header(L('Мои результаты', 'My results', 'Менің нәтижелерім'), { sub:L('Баллы преподавателя по каждой части экзамена', 'Teacher’s scores for each exam part', 'Емтиханның әр бөлімі бойынша оқытушы қойған ұпайлар') }) +
    cols(rw || W('', emptyBox('chart', L('Результатов пока нет', 'No results yet', 'Әзірге нәтиже жоқ'), L('Начните экзамен — здесь появятся баллы и комментарии преподавателя.', 'Start an exam — the teacher’s scores and comments will appear here.', 'Емтиханды бастаңыз — мұнда оқытушының ұпайлары мен пікірлері пайда болады.'), `<button class="btn" data-act="tab" data-v="exam">${ico('tests')}${L('К экзамену', 'To exams', 'Емтиханға')}</button>`)),
      W(L('Попытки тестов', 'Test attempts', 'Тест әрекеттері'), atts));
}

/* --- разбор попытки (общий для студента и преподавателя) --- */
function reviewList(a, full, filter){
  return a.details.map((d, k) => [d, k]).filter(([d]) => filter !== 'err' || d.status !== 'correct').map(([d, k]) => `<div class="card rv st-${d.status}">
      <div class="row"><span class="rv-ic" title="${stLabel(d.status)}">${ico(ST[d.status][2])}</span><b class="grow">${L('Задание', 'Question', 'Тапсырма')} ${k + 1} <span class="sub" style="font-weight:400">· ${qtName(d.type)}</span></b><span class="pts ${'c-' + (ST[d.status][0] || 'x')}">${fmtN(d.earned)}/${fmtN(d.max)}</span></div>
      <div class="rv-q">${esc(d.text)}</div>
      <div class="rv-a"><span>${full ? L('Ответ студента', 'Student’s answer', 'Студент жауабы') : L('Ваш ответ', 'Your answer', 'Сіздің жауабыңыз')}</span><b>${esc(trAns(d, d.user))}</b></div>
      ${(full || a.showAnswers) && d.status !== 'correct' ? `<div class="rv-a ok"><span>${L('Правильно', 'Correct answer', 'Дұрыс жауап')}</span><b>${esc(trAns(d, d.corr))}</b></div>` : ''}
      <div class="rv-a"><span>${L('Время', 'Time', 'Уақыт')}</span><b class="num">${fmtT(d.time)}</b></div>
    </div>`).join('');
}
function vResult(){
  const a = D.attempts.find(x => x.id === S.params.id && (isT() || x.userId === ME.id));
  const back = S.params.tab || 'exam';
  if(!a) return header(L('Результат', 'Result', 'Нәтиже'), {back}) + emptyBox('chart', L('Попытка не найдена', 'Attempt not found', 'Әрекет табылмады'), '');
  const cnt = s => a.details.filter(d => d.status === s).length, n = a.details.length, q = quality(a.percent, a.passPercent);
  const errs = a.details.filter(d => d.status !== 'correct').length, r = roomById(a.roomId);
  const score = `<div class="widget score"><div class="ttl-s ell">${esc(a.testTitle)}${r ? ' · ' + esc(r.title) : ''}</div>
      <div class="row"><div class="big num ${Q_CLS[q]}">${a.percent}%</div><div style="padding-bottom:4px"><div class="ql ${Q_CLS[q]}">${passLabel(a)}</div><div class="sub">${fmtN(a.score)} ${L('из', 'of', '/')} ${pts(a.max)}</div></div></div>
      ${meter(a.percent, a.passPercent, {size:'lg', anim:true, label:true})}
      <div class="stats"><div class="stat"><b class="num">${fmtT(a.duration)}</b><span>${a.timeLimit ? L('из ', 'of ', 'шегі ') + fmtT(a.timeLimit * 60000) : L('время', 'time', 'уақыт')}</span></div>
        <div class="stat"><b class="num">${cnt('correct')}/${n}</b><span>${L('верно', 'correct', 'дұрыс')}</span></div>
        <div class="stat"><b class="num">${cnt('wrong')}</b><span>${L('ошибок', 'wrong', 'қате')}</span></div></div>
      <div class="dist" aria-hidden="true">${['correct', 'partial', 'wrong', 'empty'].map((s, k) => cnt(s) ? `<i class="${['b-ok', 'b-mid', 'b-low', 'b-none'][k]}" style="flex:${cnt(s)}"></i>` : '').join('')}</div>
      <div class="legend"><span><i class="b-ok"></i>${L('верно', 'correct', 'дұрыс')} ${cnt('correct')}</span><span><i class="b-mid"></i>${L('частично', 'partial', 'ішінара')} ${cnt('partial')}</span><span><i class="b-low"></i>${L('неверно', 'wrong', 'қате')} ${cnt('wrong')}</span><span><i class="b-none"></i>${L('без ответа', 'no answer', 'жауапсыз')} ${cnt('empty')}</span></div>
      ${a.auto ? `<div class="chips"><span class="chip mid">${ico('clock')}${L('Время вышло', 'Time’s up', 'Уақыт бітті')}</span></div>` : ''}
      <div class="fhint">${L('Итоговый балл за тестовую часть выставляет преподаватель.', 'The final score for the test part is set by the teacher.', 'Тест бөлімі бойынша қорытынды ұпайды оқытушы қояды.')}</div></div>
    <div class="btns res-btns"><button class="btn" data-act="back" data-fb="${back}">${L('Готово', 'Done', 'Дайын')}</button></div>`;
  const review = W(L('Разбор', 'Review', 'Талдау'), (errs && errs < n ? `<div class="seg"><button class="${S.rvTab !== 'err' ? 'on' : ''}" data-act="rvTab" data-t="all">${L('Все', 'All', 'Барлығы')} <span class="cnt">${n}</span></button><button class="${S.rvTab === 'err' ? 'on' : ''}" data-act="rvTab" data-t="err">${L('Ошибки', 'Mistakes', 'Қателер')} <span class="cnt low">${errs}</span></button></div>` : '')
    + reviewList(a, isT(), S.rvTab));
  return header(L('Результат', 'Result', 'Нәтиже'), { back, sub: fmtDate(a.finishedAt) }) + cols(review, score, {sideFirst:true});
}


/* ========== ПРЕПОДАВАТЕЛЬ ========== */
function roomCardT(r){
  const st = students(), prs = st.map(u => progress(r, u.id));
  const started = prs.filter(p => p.started).length, sub = prs.filter(p => p.submitted).length, toGrade = prs.reduce((s, p) => s + p.toGrade, 0);
  const qn = D.queue.filter(q => q.roomId === r.id && q.status !== 'done').length;
  return `<div class="card tap" role="button" tabindex="0" data-act="openRoom" data-id="${r.id}">
    ${strip(r.open ? L('Открыт', 'Open', 'Ашық') : L('Закрыт', 'Closed', 'Жабық'), r.title, null)}
    <div class="chips">${roomParts(r).map(k => `<span class="chip">${ico(partIcon(k))}${partShort(k)}</span>`).join('')}${toGrade ? `<span class="chip mid">${ico('pen')}${L('Проверить', 'To grade', 'Тексеру')}: ${toGrade}</span>` : ''}${qn ? `<span class="chip ac">${ico('users')}${L('Очередь', 'Queue', 'Кезек')}: ${qn}</span>` : ''}</div>
    <div class="meta">${L('Начали', 'Started', 'Бастағандар')}: ${started}/${st.length}<span class="dot">·</span>${L('Сдали всё', 'Fully submitted', 'Толық тапсырғандар')}: ${sub}</div></div>`;
}
const qRank = { live:0, called:1, waiting:2 };
function queueItem(q, showRoom){
  const u = userById(q.userId), r = roomById(q.roomId); if(!u || !r) return '';
  let st, btns, extra = '';
  if(q.status === 'waiting'){ st = `<span class="chip">№${queuePos(q)}</span>`;
    btns = `<button class="btn sm" data-act="qCall" data-id="${q.id}">${ico('bell')}${L('Вызвать', 'Call', 'Шақыру')}</button>`; }
  else if(q.status === 'called'){ st = `<span class="chip mid">${L('Вызван', 'Called', 'Шақырылды')}</span>`;
    btns = `<button class="btn sm" data-act="qStart" data-id="${q.id}">${ico('play')}${L('Начать и засечь время', 'Start timer', 'Бастау және уақытты белгілеу')}</button><button class="btn sec sm" data-act="qBack" data-id="${q.id}">${L('Не подошёл', 'No-show', 'Келмеді')}</button>`; }
  else { st = `<span class="chip low live-dot">${L('Идёт', 'Live', 'Жүріп жатыр')}</span>`;
    extra = `<div class="qlive">${ico('clock')}<span class="qtimer num" data-live="${q.startedAt}" data-lim="${r.speaking.minutes}">00:00</span><span class="muted">/ ${r.speaking.minutes}:00</span></div>`;
    btns = `<button class="btn danger sm" data-act="qStop" data-id="${q.id}">${ico('stop')}${L('Завершить', 'Stop', 'Аяқтау')}</button>`; }
  return `<div class="qitem st-${q.status}"><div class="row"><span class="avatar sm">${esc(initials(u.name))}</span><div class="grow"><b class="ell">${esc(u.name)}</b>${showRoom ? `<small class="ell">${esc(r.title)}</small>` : ''}</div>${st}
    <button class="ib sm ghost" data-act="qRemove" data-id="${q.id}" aria-label="${L('Убрать из очереди', 'Remove from queue', 'Кезектен алып тастау')}" title="${L('Убрать из очереди', 'Remove from queue', 'Кезектен алып тастау')}">${ico('x')}</button></div>${extra}<div class="btns q-btns">${btns}</div></div>`;
}
function queueWidget(roomId){
  const items = D.queue.filter(q => q.status !== 'done' && (!roomId || q.roomId === roomId)).sort((a, b) => qRank[a.status] - qRank[b.status] || a.addedAt - b.addedAt);
  const done = roomId ? D.queue.filter(q => q.status === 'done' && q.roomId === roomId).sort((a, b) => b.endedAt - a.endedAt) : [];
  return W(L('Очередь на спикинг', 'Speaking queue', 'Спикинг кезегі'), (items.length ? `<div class="queue">${items.map(q => queueItem(q, !roomId)).join('')}</div>` : `<div class="cal-empty">${L('Очередь пуста.', 'The queue is empty.', 'Кезек бос.')}</div>`) +
    (done.length ? `<div class="sect"><h2>${L('Завершены', 'Finished', 'Аяқталғандар')}</h2></div>${done.map(q => { const u = userById(q.userId); return u ? `<div class="donerow" role="button" tabindex="0" data-act="openGrade" data-room="${q.roomId}" data-user="${q.userId}"><span class="avatar sm">${esc(initials(u.name))}</span><span class="grow ell">${esc(u.name)}</span><span class="num">${fmtT(q.duration)}</span>${gradeFor(q.roomId, q.userId, 'speaking') ? ico('check', 'okic') : `<span class="chip mid">${L('оценить', 'grade', 'бағалау')}</span>`}</div>` : ''; }).join('')}` : ''),
    { right: items.length ? `<span class="chip ac">${items.length}</span>` : '', cls:'qwidget' });
}
function studentsWidget(){
  const st = students();
  return W(L('Студенты', 'Students', 'Студенттер'), (st.length ? `<div class="ulist">${st.map(u => `<div class="urow"><span class="avatar sm">${esc(initials(u.name))}</span><div class="grow"><b class="ell">${esc(u.name)}</b><small>${L('логин', 'login', 'логин')}: ${esc(u.login)}</small></div>
      <button class="ib sm ghost" data-act="userMenu" data-id="${u.id}" aria-label="${L('Действия со студентом', 'Student actions', 'Студентпен әрекеттер')}">${ico('more')}</button></div>`).join('')}</div>` : `<div class="cal-empty">${L('Студентов пока нет.', 'No students yet.', 'Әзірге студенттер жоқ.')}</div>`) +
    `<button class="btn sec block" data-act="addUser">${ico('plus')}${L('Добавить студента', 'Add student', 'Студент қосу')}</button>`);
}
function vExamT(){
  const list = D.rooms.length ? `<div class="cards">${D.rooms.map(roomCardT).join('')}</div>`
    : emptyBox('door', L('Комнат пока нет', 'No rooms yet', 'Әзірге бөлмелер жоқ'), L('Создайте комнату экзамена и выберите, из каких частей она состоит.', 'Create an exam room and choose which parts it includes.', 'Емтихан бөлмесін жасап, оның қандай бөлімдерден тұратынын таңдаңыз.'), `<button class="btn" data-act="newRoom">${ico('plus')}${L('Создать комнату', 'Create room', 'Бөлме жасау')}</button>`);
  const waiting = D.queue.filter(q => q.status !== 'done').length;
  return header(L('Экзамен', 'Exam', 'Емтихан'), { sub:`${D.rooms.length} ${pl(D.rooms.length, 'комната', 'комнаты', 'комнат', 'room', 'rooms', 'бөлме')} · ${L('в очереди', 'in queue', 'кезекте')}: ${waiting}`,
      right:`<button class="btn sm" data-act="newRoom">${ico('plus')}<span class="hide-s">${L('Новая комната', 'New room', 'Жаңа бөлме')}</span></button>` }) +
    cols(W(L('Комнаты экзамена', 'Exam rooms', 'Емтихан бөлмелері'), list), queueWidget(null) + studentsWidget());
}

/* --- комната (преподаватель): прогресс студентов + очередь --- */
function cellFor(r, u, p, k){
  const g = p.grades[k];
  let s;
  if(k === 'test') s = p.test.done ? `${ico('check', 'okic')}${L('пройден', 'done', 'өтті')}${p.test.autoPct != null ? ` · ${p.test.autoPct}%` : ''}` : p.test.started ? `${p.test.n}/${p.test.of}` : '<span class="muted">—</span>';
  else if(k === 'writing') s = p.writing.done ? `${ico('check', 'okic')}${wordsTxt(p.writing.w.words)}` : '<span class="muted">—</span>';
  else { const q = p.speaking.q;
    s = !p.speaking.unlocked ? `<span class="muted">${ico('lock')}${L('закрыт', 'locked', 'жабық')}</span>` : !q ? `<span class="muted">${L('открыт', 'unlocked', 'ашық')}</span>`
      : q.status === 'done' ? `${ico('check', 'okic')}${fmtT(q.duration)}` : q.status === 'live' ? `<span class="c-low">${L('идёт', 'live', 'жүріп жатыр')}</span>` : q.status === 'called' ? `<span class="c-mid">${L('вызван', 'called', 'шақырылды')}</span>` : `${L('в очереди', 'queued', 'кезекте')} №${queuePos(q)}`; }
  return `<td><div class="cell">${s}</div>${g ? `<span class="sc ${'q-' + quality(pctOf(g.score, r[k].max))}">${fmtN(g.score)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('ждёт', 'pending', 'күтуде')}</span>` : ''}</td>`;
}
function vRoomT(){
  const r = roomById(S.params.id);
  if(!r) return header(L('Экзамен', 'Exam', 'Емтихан'), {back:'exam'}) + emptyBox('door', L('Комната не найдена', 'Room not found', 'Бөлме табылмады'), '');
  const st = students(), parts = roomParts(r);
  const rows = st.map(u => { const p = progress(r, u.id);
    const canQ = r.speaking.on && p.speaking.unlocked && !p.speaking.q;
    return `<tr><th scope="row"><div class="who"><span class="avatar sm">${esc(initials(u.name))}</span><span>${esc(u.name)}<small>${esc(u.login)}</small></span></div></th>${parts.map(k => cellFor(r, u, p, k)).join('')}
      <td class="num tot">${p.anyGraded ? `<b>${fmtN(p.total)}</b>` : '—'}<small> / ${fmtN(roomMax(r))}</small></td>
      <td class="acts">${canQ ? `<button class="btn sec sm" data-act="qAdd" data-room="${r.id}" data-user="${u.id}">${ico('users')}${L('В очередь', 'Queue', 'Кезекке')}</button>` : ''}<button class="btn sm" data-act="openGrade" data-room="${r.id}" data-user="${u.id}">${ico('pen')}${L('Проверить', 'Grade', 'Тексеру')}</button></td></tr>`; }).join('');
  const table = st.length ? `<div class="tbl-wrap"><table class="sheet prog"><thead><tr><th scope="col">${L('Студент', 'Student', 'Студент')}</th>${parts.map(k => `<th scope="col">${partShort(k)}<small>/ ${fmtN(r[k].max)}</small></th>`).join('')}<th scope="col">${L('Итого', 'Total', 'Барлығы')}</th><th scope="col"><span class="sr">${L('Действия', 'Actions', 'Әрекеттер')}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`
    : emptyBox('users', L('Студентов нет', 'No students', 'Студенттер жоқ'), L('Добавьте студентов на странице «Экзамен».', 'Add students on the Exam page.', '«Емтихан» бетінде студенттерді қосыңыз.'));
  const info = W(L('Состав экзамена', 'Exam parts', 'Емтихан құрамы'), parts.map(k => `<div class="sumrow"><span class="sico sm">${ico(partIcon(k))}</span><span class="grow">${partName(k)}<small>${
      k === 'test' ? roomTests(r).map(t => esc(t.title)).join(', ') : k === 'writing' ? `${L('минимум', 'minimum', 'кемінде')} ${wordsTxt(r.writing.minWords)}` : `${r.speaking.minutes} ${L('мин на ответ', 'min per answer', 'мин жауапқа')}`}</small></span><b class="num">${fmtN(r[k].max)}</b></div>`).join('') +
    `<div class="sumtotal"><span class="grow">${L('Максимум', 'Maximum', 'Максимум')}</span><b class="num">${fmtN(roomMax(r))}</b></div>
    <div class="btns col"><button class="btn sec" data-act="toggleRoom" data-id="${r.id}">${ico(r.open ? 'lock' : 'unlock')}${r.open ? L('Закрыть экзамен', 'Close exam', 'Емтиханды жабу') : L('Открыть экзамен', 'Open exam', 'Емтиханды ашу')}</button>
    <button class="btn sec" data-act="editRoom" data-id="${r.id}">${ico('edit')}${L('Редактировать', 'Edit', 'Өңдеу')}</button></div>`);
  return header(r.title, { back:'exam', sub:`<span class="chip ${r.open ? 'ac' : ''}">${r.open ? L('Открыт для студентов', 'Open to students', 'Студенттер үшін ашық') : L('Закрыт', 'Closed', 'Жабық')}</span>` }) +
    cols(W(L('Прогресс студентов', 'Student progress', 'Студенттердің үлгерімі'), table) , queueWidget(r.id) + info);
}

/* --- проверка работы и выставление баллов --- */
function gaWidget(){
  const left = gaUntil() - Date.now();
  return W(L('Доступ к оценкам', 'Grading access', 'Бағалауға рұқсат'), left > 0
    ? `<div class="statebox done">${ico('unlock')}<div><b>${L('Открыт', 'Unlocked', 'Ашық')}</b><div class="sub">${L('Пароль действует ещё', 'Password valid for', 'Құпиясөздің қалған мерзімі')} <span class="num" data-ga>${fmtT(left)}</span></div></div></div><button class="btn sec block" data-act="gaLock">${ico('lock')}${L('Закрыть доступ сейчас', 'Lock now', 'Рұқсатты қазір жабу')}</button>`
    : `<div class="statebox lock">${ico('lock')}<div><b>${L('Закрыт', 'Locked', 'Жабық')}</b><div class="sub">${L('Чтобы выставить балл, введите пароль преподавателя. Он действует 1 час.', 'Enter the teacher password to grade. It stays valid for 1 hour.', 'Ұпай қою үшін оқытушы құпиясөзін енгізіңіз. Ол 1 сағат жарамды.')}</div></div></div><button class="btn block" data-act="gaUnlock">${ico('unlock')}${L('Ввести пароль', 'Enter password', 'Құпиясөзді енгізу')}</button>`);
}
function gradeForm(r, u, p, k, auto){
  const g = p.grades[k], max = r[k].max, can = partDone(p, k);
  if(!can) return `<div class="note">${ico('alert')}<span>${L('Часть ещё не сдана — балл можно выставить после сдачи.', 'This part is not submitted yet — you can grade it after submission.', 'Бөлім әлі тапсырылмаған — ұпайды тапсырылғаннан кейін қоюға болады.')}</span></div>`;
  return `<div class="gform"><div class="gf-row"><div><label class="f" for="sc-${k}">${L('Балл', 'Score', 'Ұпай')}</label><div class="scin"><input class="field num" id="sc-${k}" type="text" inputmode="decimal" autocomplete="off" aria-describedby="scmax-${k}" value="${g ? fmtN(g.score) : ''}"><span id="scmax-${k}">/ ${fmtN(max)}</span></div></div>
      ${auto != null ? `<button class="btn ghost sm" data-act="useAuto" data-part="${k}" data-v="${auto}">${ico('refresh')}${L('Подставить авто-балл', 'Use auto score', 'Авто-ұпайды қою')}: ${fmtN(auto)}</button>` : ''}</div>
    <label class="f" for="cm-${k}">${L('Комментарий для студента', 'Comment for the student', 'Студентке пікір')}</label><textarea class="field" id="cm-${k}" rows="2" placeholder="${L('Необязательно', 'Optional', 'Міндетті емес')}">${esc(g ? g.comment : '')}</textarea>
    <div class="gf-foot"><span class="sub">${g ? `${ico('check', 'okic')}${L('Выставлено', 'Graded', 'Қойылды')} ${fmtDate(g.gradedAt)}` : L('Ещё не оценено', 'Not graded yet', 'Әлі бағаланбаған')}</span>
      <button class="btn" data-act="saveGrade" data-part="${k}">${ico(gaOpen() ? 'check' : 'lock')}${g ? L('Обновить балл', 'Update score', 'Ұпайды жаңарту') : L('Выставить балл', 'Save score', 'Ұпай қою')}</button></div></div>`;
}
function gradePart(r, u, p, k, n){
  let body = '';
  if(k === 'test'){
    body = p.test.tests.map((t, i) => { const a = p.test.atts[i];
      if(!a) return `<div class="card prow"><p class="ttl">${esc(t.title)}</p><div class="meta">${L('Не пройден', 'Not taken', 'Өтпеген')}</div></div>`;
      return `<div class="card prow"><div class="row wrap"><div class="grow"><p class="ttl">${esc(t.title)}</p><div class="meta">${fmtN(a.score)} / ${fmtN(a.max)} · <b class="${Q_CLS[quality(a.percent, a.passPercent)]}">${a.percent}%</b><span class="dot">·</span>${fmtT(a.duration)}<span class="dot">·</span>${fmtDate(a.finishedAt)}</div></div>
        <button class="btn ghost sm" data-act="annul" data-id="${a.id}">${ico('undo')}${L('Аннулировать', 'Void attempt', 'Жарамсыз деп тану')}</button></div>
        <details class="rvd"><summary>${L('Ответы студента', 'Student’s answers', 'Студент жауаптары')} (${a.details.length})</summary>${reviewList(a, true)}</details></div>`; }).join('');
    body += gradeForm(r, u, p, k, p.test.auto);
  } else if(k === 'writing'){
    const w = p.writing.w;
    body = `<div class="prompt">${esc(r.writing.prompt)}</div>` + (w ? `<div class="essay">${esc(w.text)}</div><div class="meta">${wordsTxt(w.words)} ${w.words < r.writing.minWords ? `<span class="c-mid">(${L('меньше минимума', 'below minimum', 'ең аз шектен төмен')} ${r.writing.minWords})</span>` : ''}<span class="dot">·</span>${L('сдано', 'submitted', 'тапсырылды')} ${fmtDate(w.submittedAt)}</div>` : '') + gradeForm(r, u, p, k);
  } else {
    const q = p.speaking.q;
    body = `<div class="prompt">${esc(r.speaking.prompt)}</div>` +
      (q && q.status === 'done' ? `<div class="statebox done">${ico('clock')}<div><b>${L('Длительность', 'Duration', 'Ұзақтығы')}: ${fmtT(q.duration)}</b><div class="sub">${L('Лимит', 'Limit', 'Шегі')} ${r.speaking.minutes}:00 · ${fmtDate(q.startedAt)}</div></div></div>`
        : q ? `<div class="note">${ico('users')}<span>${L('Студент в очереди. Управляйте вызовом на странице комнаты.', 'The student is in the queue. Manage the call on the room page.', 'Студент кезекте. Шақыруды бөлме бетінде басқарыңыз.')}</span></div>`
        : p.speaking.unlocked ? `<button class="btn sec sm" data-act="qAdd" data-room="${r.id}" data-user="${u.id}">${ico('users')}${L('Поставить в очередь', 'Add to queue', 'Кезекке қою')}</button>` : '') + gradeForm(r, u, p, k);
  }
  return W(stepTitle(n, k), body, { right: p.grades[k] ? `<span class="sc ${'q-' + quality(pctOf(p.grades[k].score, r[k].max))}">${fmtN(p.grades[k].score)} / ${fmtN(r[k].max)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('Ждёт оценки', 'Awaiting grade', 'Бағалауды күтуде')}</span>` : `<span class="chip">${L('Не сдано', 'Not submitted', 'Тапсырылмаған')}</span>`, cls:'part' });
}
function vGrade(){
  const r = roomById(S.params.room), u = userById(S.params.user);
  if(!r || !u) return header(L('Проверка', 'Grading', 'Тексеру'), {back:'exam'}) + emptyBox('pen', L('Работа не найдена', 'Work not found', 'Жұмыс табылмады'), '');

/* --- лист баллов --- */
function scoreTable(r){
  const st = students(), parts = roomParts(r), max = roomMax(r);
  const prs = st.map(u => [u, progress(r, u.id)]);
  const avg = k => { const v = prs.map(([, p]) => p.grades[k]).filter(Boolean); return v.length ? r2(v.reduce((s, g) => s + g.score, 0) / v.length) : null; };
  const full = prs.filter(([, p]) => p.allGraded);
  const rows = prs.map(([u, p]) => `<tr class="tap" role="button" tabindex="0" data-act="openGrade" data-room="${r.id}" data-user="${u.id}" data-tab="scores">
      <th scope="row"><div class="who"><span class="avatar sm">${esc(initials(u.name))}</span><span>${esc(u.name)}<small>${esc(u.login)}</small></span></div></th>
      ${parts.map(k => { const g = p.grades[k]; return `<td>${g ? `<span class="sc ${'q-' + quality(pctOf(g.score, r[k].max))}" title="${esc(g.comment || '')}">${fmtN(g.score)}</span>` : partDone(p, k) ? `<span class="chip mid">${L('ждёт', 'pending', 'күтуде')}</span>` : '<span class="muted">—</span>'}</td>`; }).join('')}
      <td class="num tot">${p.anyGraded ? `<b>${fmtN(p.total)}</b>` : '<span class="muted">—</span>'}</td>
      <td class="pctc">${p.allGraded ? `<div class="pcell"><b class="${Q_CLS[quality(pctOf(p.total, max))]}">${pctOf(p.total, max)}%</b>${meter(pctOf(p.total, max), 60)}</div>` : `<span class="muted">${p.anyGraded ? L('частично', 'partial', 'ішінара') : '—'}</span>`}</td></tr>`).join('');
  const foot = `<tr><th scope="row">${L('Средний балл', 'Average', 'Орташа ұпай')}</th>${parts.map(k => { const a = avg(k); return `<td class="num">${a == null ? '—' : fmtN(a)}</td>`; }).join('')}
    <td class="num">${full.length ? fmtN(r2(full.reduce((s, [, p]) => s + p.total, 0) / full.length)) : '—'}</td><td></td></tr>`;
  return `<div class="tbl-wrap"><table class="sheet"><thead><tr><th scope="col">${L('Студент', 'Student', 'Студент')}</th>${parts.map(k => `<th scope="col">${partShort(k)}<small>/ ${fmtN(r[k].max)}</small></th>`).join('')}<th scope="col">${L('Итого', 'Total', 'Барлығы')}<small>/ ${fmtN(max)}</small></th><th scope="col">%</th></tr></thead>
    <tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
}
function vScores(){
  const rooms = D.rooms.filter(r => !S.scoreRoom || r.id === S.scoreRoom);
  const g = D.grades, st = students();
  const fullCnt = D.rooms.reduce((s, r) => s + st.filter(u => progress(r, u.id).allGraded).length, 0);
  const pend = D.rooms.reduce((s, r) => s + st.reduce((t, u) => t + progress(r, u.id).toGrade, 0), 0);
  const tiles = `<div class="tiles"><div class="tile2"><b>${st.length}</b><span>${pl(st.length, 'студент', 'студента', 'студентов', 'student', 'students', 'студент')}</span></div>
    <div class="tile2"><b>${g.length}</b><span>${L('баллов выставлено', 'scores given', 'қойылған ұпай')}</span></div>
    <div class="tile2"><b>${fullCnt}</b><span>${L('работ оценено полностью', 'fully graded', 'толық бағаланған жұмыс')}</span></div>
    <div class="tile2 ${pend ? 'warn' : ''}"><b>${pend}</b><span>${L('ждут проверки', 'awaiting grading', 'тексеруді күтуде')}</span></div></div>`;
  const chips = D.rooms.length > 1 ? `<div class="fchips"><button class="${!S.scoreRoom ? 'on' : ''}" data-act="scoreRoom" data-id="">${L('Все комнаты', 'All rooms', 'Барлық бөлмелер')}</button>${D.rooms.map(r => `<button class="${S.scoreRoom === r.id ? 'on' : ''}" data-act="scoreRoom" data-id="${r.id}">${esc(r.title)}</button>`).join('')}</div>` : '';
  const log = g.slice().sort((a, b) => b.gradedAt - a.gradedAt).slice(0, 12).map(x => { const u = userById(x.userId), r = roomById(x.roomId); if(!u || !r) return '';
    return `<div class="logrow"><span class="sc ${'q-' + quality(pctOf(x.score, x.max))}">${fmtN(x.score)}</span><div class="grow"><b class="ell">${esc(u.name)} · ${partShort(x.part)}</b><small class="ell">${esc(r.title)} · ${fmtDate(x.gradedAt)}</small></div></div>`; }).join('');
  return header(L('Лист баллов', 'Score sheet', 'Ұпайлар парағы'), { sub:L('Баллы, выставленные по каждой части экзамена', 'Scores given for each part of the exam', 'Емтиханның әр бөлімі бойынша қойылған ұпайлар'),
      right:`<button class="ib" data-act="printSheet" aria-label="${L('Печать', 'Print', 'Басып шығару')}" title="${L('Печать', 'Print', 'Басып шығару')}">${ico('print')}</button><button class="btn sm" data-act="csv">${ico('down')}CSV</button>` }) +
    tiles + chips + cols(rooms.length ? rooms.map(r => W(esc(r.title), scoreTable(r), { right:`<span class="chip">${L('макс.', 'max', 'макс.')} ${fmtN(roomMax(r))}</span>` })).join('') : W('', emptyBox('table', L('Комнат нет', 'No rooms', 'Бөлмелер жоқ'), '')),
      W(L('Последние оценки', 'Latest scores', 'Соңғы бағалар'), log || `<div class="cal-empty">${L('Баллы ещё не выставлялись.', 'No scores given yet.', 'Ұпайлар әлі қойылмаған.')}</div>`) +
      W(L('Цвета', 'Colours', 'Түстер'), `<div class="legend col"><span><i class="b-ok"></i>${L('от 75% — высокий балл', '75%+ — high score', '75%-дан бастап — жоғары ұпай')}</span><span><i class="b-mid"></i>${L('50–74% — средний балл', '50–74% — average score', '50–74% — орташа ұпай')}</span><span><i class="b-low"></i>${L('ниже 50%', 'below 50%', '50%-дан төмен')}</span></div>`));
}
function downloadCSV(){
  const sep = ';', q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [[L('Комната', 'Room', 'Бөлме'), L('Студент', 'Student', 'Студент'), L('Логин', 'Login', 'Логин'), L('Тест', 'Test', 'Тест'), L('Письмо', 'Writing', 'Жазылым'), L('Спикинг', 'Speaking', 'Спикинг'), L('Итого', 'Total', 'Барлығы'), L('Максимум', 'Maximum', 'Максимум'), '%']];
  D.rooms.forEach(r => students().forEach(u => { const p = progress(r, u.id); if(!p.started && !p.anyGraded) return;
    const c = k => r[k].on ? (p.grades[k] ? fmtN(p.grades[k].score) : '') : '-';
    rows.push([r.title, u.name, u.login, c('test'), c('writing'), c('speaking'), p.anyGraded ? fmtN(p.total) : '', fmtN(roomMax(r)), p.allGraded ? pctOf(p.total, roomMax(r)) : '']); }));
  const csv = '﻿' + rows.map(rw => rw.map(q).join(sep)).join('\r\n');
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = 'exam-scores.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(L('Файл CSV скачан', 'CSV downloaded', 'CSV файлы жүктелді')); }
  catch(e){ toast(L('Скачивание недоступно в этом окне', 'Download is not available here', 'Бұл терезеде жүктеп алу қолжетімсіз')); }
}

// проверка знаний: 10 вопросов по словам и идиомам
function makeQuiz(){
  const pool = [];
  D.learn.words.forEach(w => pool.push({ kind:'word', q:w.word, a:w.translation, all:D.learn.words.map(x => x.translation) }));
  D.learn.idioms.forEach(i => pool.push({ kind:'idiom', q:i.phrase, a:i.meaning, all:D.learn.idioms.map(x => x.meaning) }));
  const qs = shuffle(pool).map(it => { const wrong = shuffle([...new Set(it.all.filter(x => x !== it.a))]).slice(0, 3); const options = shuffle([it.a, ...wrong]);
    return { kind:it.kind, prompt:it.q, options, correct:options.indexOf(it.a) }; }).filter(x => x.options.length >= 2).slice(0, 10);
  return { qs, i:0, picks:[], done:false };
}

function saveGrade(part){

  if(raw === '' || isNaN(v) || v < 0 || v > max){ toast(L(`Балл должен быть от 0 до ${fmtN(max)}`, `Score must be between 0 and ${fmtN(max)}`, `Ұпай 0 мен ${fmtN(max)} аралығында болуы керек`)); inp.focus(); return; }
  const comment = cm.value.trim(), score = r2(v);
  withGradeAuth(() => {

}

    const sub = document.getElementById('answered'); if(sub) sub.textContent = L('Отвечено ', 'Answered ', 'Жауап берілді ') + answeredCount(S.run) + L(' из ', ' of ', ' / ') + S.run.order.length; },
  ordText: el => { const q = S.draft.questions[+el.dataset.q]; const v = el.value;
    q.items = v.includes('|') ? v.split('|').map(x => x.trim()).filter(Boolean) : v.split(/\s+/).filter(Boolean);
    const pv = document.getElementById('pv-' + q.id); if(pv) pv.innerHTML = wordsPreview(q.items); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el || el.disabled || el.closest('.ov')) return; const f = ACT[el.dataset.act]; if(f) f(el, e); });
document.addEventListener('submit', e => { if(e.target.id === 'loginForm'){ e.preventDefault(); doLogin(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.inp && INP[el.dataset.inp] && el.tagName !== 'SELECT') INP[el.dataset.inp](el);
  if(el.dataset.path && S.draft && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT'){
    setPath(S.draft, el.dataset.path, readVal(el));
    const sum = document.getElementById('edSum'); if(sum) sum.textContent = editorSummary();
    if(el.dataset.refresh){ const m = el.dataset.path.match(/^questions\.(\d+)\.pairs\.(\d+)/); const p = S.draft.questions[+m[1]].pairs[+m[2]];
      const th = el.parentElement.querySelector('.thumb'); if(th && !p.img) th.innerHTML = esc(p.label) || ico('img'); }
  }
  if(el.dataset.rpath && S.rdraft && el.type !== 'checkbox'){ setPath(S.rdraft, el.dataset.rpath, readVal(el)); const m = document.getElementById('rMax'); if(m) m.textContent = fmtN(roomMax(S.rdraft)); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.path && S.draft && (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT')){ setPath(S.draft, el.dataset.path, readVal(el)); if(el.dataset.rerender) render(); }
  if(el.dataset.chg === 'mc'){ const q = S.draft.questions[+el.dataset.q], j = +el.dataset.j;
    q.correct = el.checked ? [...new Set(q.correct.concat(j))].sort((a, b) => a - b) : q.correct.filter(x => x !== j); }
  if(el.dataset.rpath && S.rdraft && el.type === 'checkbox'){ setPath(S.rdraft, el.dataset.rpath, el.checked); if(el.dataset.rerender) render(); }
  if(el.dataset.chg === 'roomTest' && S.rdraft){ const ids = S.rdraft.test.testIds, id = el.dataset.id;
    S.rdraft.test.testIds = el.checked ? (ids.includes(id) ? ids : ids.concat(id)) : ids.filter(x => x !== id); }
});
document.getElementById('imgpick').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !pendingImg || !S.draft) return;
  const {q, j} = pendingImg; loadImage(f, url => { if(S.draft && S.draft.questions[q]){ S.draft.questions[q].pairs[j].img = url; render(); } });
});
document.getElementById('jsonpick').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) importFile(f); });
document.addEventListener('keydown', e => {
  const ovs = document.querySelectorAll('.ov');
  if(e.key === 'Escape' && ovs.length){ ovs[ovs.length - 1]._close(); return; }
  if(ovs.length) return;
  const el = e.target;
  if((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.act){ e.preventDefault(); el.click(); return; }
  if(S.view !== 'run' || !S.run) return;
  if(e.key === 'Enter' && el.id === 'ansInput'){ e.preventDefault(); const b = app.querySelector('.dock [data-act="nextQ"],.dock [data-act="finish"]'); if(b) b.click(); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowRight'){ moveTo(S.run.pos + 1); return; }
  if(e.key === 'ArrowLeft'){ moveTo(S.run.pos - 1); return; }
  const d = /^[1-9]$/.test(e.key) ? +e.key - 1 : -1; if(d < 0) return;
  const q = curQ();
  if(q.type === 'tf' && d < 2) ACT.aTf({dataset:{v: d === 0 ? '1' : '0'}});
  else if((q.type === 'single' || q.type === 'multi') && d < q.options.length) ACT[q.type === 'single' ? 'aSingle' : 'aMulti']({dataset:{j:String(d)}});
});

/* ---------- синхронизация между вкладками ---------- */
const LIVE = { exam:1, room:1, grade:1, scores:1, results:1, learn:1, editorList:1, result:1 };
const fieldFocused = () => { const a = document.activeElement; return !!a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio'; };
window.addEventListener('storage', e => {
  if(e.key === LS_KEY){
    const d = loadDB(); if(!d) return; D = d;
    if(ME){ const u = userById(ME.id); if(!u){ doLogout(); toast(L('Ваш аккаунт удалён', 'Your account was deleted', 'Сіздің аккаунтыңыз жойылды')); return; } ME = u; }
    if(LIVE[S.view] || S.view === 'login'){ if(fieldFocused() || document.querySelector('.ov')) S.syncPending = true; else render(); }
  } else if(e.key === THEME_KEY){ const t = e.newValue === 'intl' ? 'intl' : 'incampus'; if(t !== THEME){ THEME = t; applyTheme(); render(); } }
  else if(e.key === GA_KEY && S.view === 'grade' && !document.querySelector('.ov')) render();
});
setInterval(() => { tick(); if(S.syncPending && !fieldFocused() && !document.querySelector('.ov')) render(); }, 1000);

/* ===== СИНХРОНИЗАЦИЯ С СЕРВЕРОМ (добавлено): общая очередь, румы, студенты, баллы между устройствами =====
   Если сервера нет (файл открыт с диска) — приложение работает как раньше, только на localStorage. */
const SYNC = { on:false, last:{} };
const SYNC_COLS = ['users','tests','rooms','attempts','writings','queue','grades'];
const syncKey = x => x.id || [x.roomId, x.userId, x.testId || x.part || ''].join('|');
function syncSnapOf(db){ const o = {}; SYNC_COLS.forEach(c => { o[c] = {}; (db[c] || []).forEach(x => { o[c][syncKey(x)] = JSON.stringify(x); }); }); return o; }
const syncSig = o => JSON.stringify(Object.keys(o).sort().map(c => [c, Object.keys(o[c]).sort().map(k => o[c][k])]));
async function syncPush(){
  if(!SYNC.on) return;
  const cur = syncSnapOf(D), prev = SYNC.last, ch = {}; let any = false;
  SYNC_COLS.forEach(c => { const up = [], del = [];
    for(const k in cur[c]) if(prev[c][k] !== cur[c][k]) up.push(JSON.parse(cur[c][k]));
    for(const k in prev[c]) if(!(k in cur[c])) del.push(k);
    if(up.length || del.length){ ch[c] = { up, del }; any = true; } });
  if(!any) return;
  SYNC.last = cur;
  try{ const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ changes:ch }) }); if(!r.ok) throw 0; }
  catch(e){ SYNC.last = prev; }
}
function syncApply(db, force){
  if(!force && syncSig(syncSnapOf(db)) === syncSig(syncSnapOf(D))) return;
  const d = Object.assign({}, D); SYNC_COLS.forEach(c => { d[c] = db[c] || []; });
  D = normDB(d); SYNC.last = syncSnapOf(D);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){}
  if(ME){ const u = userById(ME.id); if(!u){ doLogout(); toast(L('Ваш аккаунт удалён', 'Your account was deleted', 'Сіздің аккаунтыңыз жойылды')); return; } ME = u; }
  if(LIVE[S.view] || S.view === 'login'){ if(fieldFocused() || document.querySelector('.ov')) S.syncPending = true; else render(); }
}
async function syncStart(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch('/api/state'); if(!r.ok) return; const s = await r.json();
    SYNC.last = syncSnapOf({}); SYNC.on = true;
    if(!s.rev){ syncPush(); } else syncApply(s.db, true);
    const es = new EventSource('/api/events'); es.onmessage = e => { try{ syncApply(JSON.parse(e.data).db); }catch(x){} };
  }catch(e){}
}

/* ---------- старт ---------- */
(function init(){
  applyLang(); applyTheme();
  D = loadDB();
  if(!D){ D = freshDB(); persist(); } // первый заход: создаются аккаунты user/1 и teacher/admin и пробный экзамен
  const sid = sesGet(); ME = sid ? userById(sid) || null : null;
  if(ME){ const pr = loadRun(); S.pendingRun = pr && testById(pr.test.id) ? pr : null; }
  let hs = null; try{ hs = history.state; }catch(e){}
  const VIEWS = ['exam','room','result','results','learn','editorList','editor','roomEditor','scores','grade'];
  if(ME && hs && VIEWS.includes(hs.view)){ S.view = hs.view; S.params = hs.params || {}; render(); return; }
  S.view = ME ? 'exam' : 'login';
  try{ history.replaceState({view:S.view, params:{}, depth:(hs && hs.depth) || 0}, ''); }catch(e){ HIST = false; }
  render();
})();
syncStart();
// доступ для автотестов
window.__edu = { S, get D(){ return D; }, get ME(){ return ME; }, grade, validateTest, validateRoom, progress, startTest, fmtT, quality, go, GA_TTL };
