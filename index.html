      W(L('Последние оценки', 'Latest scores'), log || `<div class="cal-empty">${L('Баллы ещё не выставлялись.', 'No scores given yet.')}</div>`) +
      W(L('Цвета', 'Colours'), `<div class="legend col"><span><i class="b-ok"></i>${L('от 80% — отлично', '80%+ — excellent')}</span><span><i class="b-mid"></i>${L('60–79% — зачтено', '60–79% — passed')}</span><span><i class="b-low"></i>${L('ниже 60%', 'below 60%')}</span></div>`));
}
function downloadCSV(){
  const sep = ';', q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [[L('Комната', 'Room'), L('Студент', 'Student'), L('Логин', 'Login'), L('Тест', 'Test'), L('Письмо', 'Writing'), L('Спикинг', 'Speaking'), L('Итого', 'Total'), L('Максимум', 'Maximum'), '%']];
  D.rooms.forEach(r => students().forEach(u => { const p = progress(r, u.id); if(!p.started && !p.anyGraded) return;
    const c = k => r[k].on ? (p.grades[k] ? fmtN(p.grades[k].score) : '') : '-';
    rows.push([r.title, u.name, u.login, c('test'), c('writing'), c('speaking'), p.anyGraded ? fmtN(p.total) : '', fmtN(roomMax(r)), p.allGraded ? pctOf(p.total, roomMax(r)) : '']); }));
  const csv = '﻿' + rows.map(rw => rw.map(q).join(sep)).join('\r\n');
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = 'exam-scores.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(L('Файл CSV скачан', 'CSV downloaded')); }
  catch(e){ toast(L('Скачивание недоступно в этом окне', 'Download is not available here')); }
}

  if(!roomParts(d).length) e.push(L('Выберите хотя бы одну часть экзамена', 'Choose at least one exam part'));
  if(d.test.on && !d.test.testIds.filter(testById).length) e.push(L('Тест: выберите хотя бы один тест', 'Test: choose at least one test'));
  if(d.writing.on && !d.writing.prompt.trim()) e.push(L('Письменная работа: напишите задание', 'Writing: enter the task'));
  if(d.speaking.on && !(d.speaking.minutes > 0)) e.push(L('Спикинг: время ответа должно быть больше 0', 'Speaking: time must be greater than 0'));

// проверка знаний: 10 вопросов по словам и идиомам
function makeQuiz(){
  const pool = [];
  D.learn.words.forEach(w => pool.push({ kind:'word', q:w.word, a:w.translation, all:D.learn.words.map(x => x.translation) }));
  D.learn.idioms.forEach(i => pool.push({ kind:'idiom', q:i.phrase, a:i.meaning, all:D.learn.idioms.map(x => x.meaning) }));
  const qs = shuffle(pool).map(it => { const wrong = shuffle([...new Set(it.all.filter(x => x !== it.a))]).slice(0, 3); const options = shuffle([it.a, ...wrong]);
    return { kind:it.kind, prompt:it.q, options, correct:options.indexOf(it.a) }; }).filter(x => x.options.length >= 2).slice(0, 10);
  return { qs, i:0, picks:[], done:false };
}
function quizBody(){

  if(z.done){ const ok = z.picks.filter((p, j) => p === z.qs[j].correct).length;
    return `<div class="quiz-res"><div class="big num ${Q_CLS[quality(pctOf(ok, z.qs.length))]}">${ok} / ${z.qs.length}</div><div class="ql">${qLabel(quality(pctOf(ok, z.qs.length)))}</div>
      ${z.qs.map((q, j) => z.picks[j] === q.correct ? '' : `<div class="card rv st-wrong"><div class="rv-q"><b>${esc(q.prompt)}</b></div><div class="rv-a"><span>${L('Ваш ответ', 'Your answer')}</span><b>${esc(q.options[z.picks[j]])}</b></div><div class="rv-a ok"><span>${L('Правильно', 'Correct')}</span><b>${esc(q.options[q.correct])}</b></div></div>`).join('')}
      <button class="btn" data-act="quizStart">${ico('refresh')}${L('Пройти ещё раз', 'Try again')}</button></div>`; }

function addToQueue(roomId, userId){
  const r = roomById(roomId); if(!r || !r.speaking.on) return;

  if(!p.speaking.unlocked){ toast(L('Спикинг откроется после теста и письменной работы', 'Speaking unlocks after the test and writing')); return; }
  if(queueFor(roomId, userId)){ toast(L('Уже в очереди', 'Already in the queue')); return; }
  D.queue.push({ id:uid(), roomId, userId, status:'waiting', addedAt:Date.now(), by:ME.id }); persist(); render();
  toast(isT() ? L('Студент поставлен в очередь', 'Student added to the queue') : L('Вы в очереди на спикинг', 'You joined the speaking queue'));

function saveGrade(part){
  const r = roomById(S.params.room), u = userById(S.params.user); if(!r || !u) return;
  const inp = document.getElementById('sc-' + part), cm = document.getElementById('cm-' + part);
  const raw = String(inp.value).replace(',', '.').trim(), v = /^\d+(\.\d+)?$/.test(raw) ? parseFloat(raw) : NaN, max = +r[part].max;
  if(raw === '' || isNaN(v) || v < 0 || v > max){ toast(L(`Балл должен быть от 0 до ${fmtN(max)}`, `Score must be between 0 and ${fmtN(max)}`)); inp.focus(); return; }
  const comment = cm.value.trim(), score = r2(v);
  withGradeAuth(() => {
    const old = gradeFor(r.id, u.id, part);
    const g = { roomId:r.id, userId:u.id, part, score, max, comment, gradedAt:Date.now(), by:ME.id };
    if(old) Object.assign(old, g); else D.grades.push(g);
    persist(); render(); toast(L('Балл выставлен: ', 'Score saved: ') + partName(part) + ' — ' + fmtN(score) + ' / ' + fmtN(max));
  });
}

    render(); },
  addAns: el => { S.draft.questions[+el.dataset.q].answers.push(''); render(); },
  delAns: el => { const q = S.draft.questions[+el.dataset.q]; if(q.answers.length > 1){ q.answers.splice(+el.dataset.j, 1); render(); } },
  addPair: el => { S.draft.questions[+el.dataset.q].pairs.push({label:'', img:'', right:''}); render(); },
  delPair: el => { const q = S.draft.questions[+el.dataset.q]; if(q.pairs.length > 2){ q.pairs.splice(+el.dataset.j, 1); render(); } },
  pickImg: el => { pendingImg = {q:+el.dataset.q, j:+el.dataset.j}; document.getElementById('imgpick').click(); },
  clrImg: el => { S.draft.questions[+el.dataset.q].pairs[+el.dataset.j].img = ''; render(); },
  saveTest: () => {
    const d = S.draft; S.errors = validateTest(d);
    if(S.errors.length){ render(); const e = document.getElementById('errs'); if(e) e.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    cleanTest(d); const k = D.tests.findIndex(t => t.id === d.id);
    if(k >= 0) D.tests[k] = d; else D.tests.unshift(d);
    persist(); S.draft = null; S.edTab = 'tests'; toast(L('Тест сохранён', 'Test saved')); goBack('editorList');
  },
  // прохождение
  aSingle: el => setAns(+el.dataset.j),
  aMulti: el => { const i = curI(), j = +el.dataset.j, s = S.run.answers[i] || []; setAns(s.includes(j) ? s.filter(x => x !== j) : s.concat(j)); },
  aTf: el => setAns(el.dataset.v === '1'),
  mLeft: el => { const j = +el.dataset.j; S.run.msel = S.run.msel === j ? null : j; render(); },
  mRight: el => {
    const r = S.run, i = curI(), q = curQ(), k = +el.dataset.k; const a = r.answers[i] || (r.answers[i] = {map:{}});
    const owner = Object.keys(a.map).find(l => a.map[l] === k);
    if(r.msel == null){ if(owner != null){ delete a.map[owner]; saveRun(); render(); } else toast(L('Сначала выберите карточку слева', 'First pick a card on the left')); return; }
    if(owner != null) delete a.map[owner];
    a.map[r.msel] = k;
    const nxt = q.pairs.findIndex((_, j) => a.map[j] == null); r.msel = nxt >= 0 ? nxt : null;
    saveRun(); render(); },
  mReset: () => { S.run.msel = null; setAns({map:{}}); },
  oAdd: el => { const s = S.run.answers[curI()] || [], p = +el.dataset.p; if(!s.includes(p)) setAns(s.concat(p)); },
  oDel: el => { const s = (S.run.answers[curI()] || []).slice(); s.splice(+el.dataset.pos, 1); setAns(s); },
  oReset: () => setAns([]),
  goQ: el => moveTo(+el.dataset.p),
  prevQ: () => moveTo(S.run.pos - 1),
  nextQ: () => moveTo(S.run.pos + 1),
  finish: () => finishAsk(),
  // обучение
  learnTab: el => { S.learnTab = el.dataset.t; S.learnQ = ''; render(); },
  learnAdd: el => learnEditForm(el.dataset.k, null),
  learnEdit: el => learnEditForm(el.dataset.k, (D.learn[el.dataset.k] || []).find(x => x.id === el.dataset.id)),
  learnDel: el => { const k = el.dataset.k, it = (D.learn[k] || []).find(x => x.id === el.dataset.id); if(!it) return;
    ask(L('Удалить запись?', 'Delete this item?'), it.title || it.phrase || it.word || '', L('Удалить', 'Delete'), () => { D.learn[k] = D.learn[k].filter(x => x !== it); persist(); S.fc = null; render(); }, {danger:true}); },
  fcFlip: () => { S.fc.flip = !S.fc.flip; render(); },
  fcNext: () => { if(S.fc.i < S.fc.order.length - 1){ S.fc.i++; S.fc.flip = false; render(); } },
  fcPrev: () => { if(S.fc.i > 0){ S.fc.i--; S.fc.flip = false; render(); } },
  fcShuffle: () => { shuffle(S.fc.order); S.fc.i = 0; S.fc.flip = false; render(); },
  quizStart: () => { S.quiz = makeQuiz(); render(); },
  quizPick: el => { const z = S.quiz; if(!z || z.picks[z.i] != null) return; z.picks[z.i] = +el.dataset.j; render(); },
  quizNext: () => { const z = S.quiz; if(!z) return;
    if(z.i < z.qs.length - 1){ z.i++; render(); return; }
    z.done = true; const ok = z.picks.filter((p, j) => p === z.qs[j].correct).length, prev = D.quiz[ME.id];
    D.quiz[ME.id] = { best:Math.max(ok, prev && prev.of === z.qs.length ? prev.best : 0), last:ok, of:z.qs.length, at:Date.now() }; persist(); render(); }
};
const INP = {
  essay: el => { draftSet(el.dataset.room, el.value); const r = roomById(el.dataset.room), c = wc(el.value), w = document.getElementById('wc');
    if(w && r){ w.textContent = wordsTxt(c) + ' · ' + L('минимум', 'minimum') + ' ' + r.writing.minWords; w.className = c < r.writing.minWords ? 'c-mid' : 'c-ac'; } },
  learnQ: el => { S.learnQ = el.value; const b = document.getElementById('learnList'); if(b) b.innerHTML = learnList(); },
  aInput: el => { S.run.answers[curI()] = el.value; saveRun();
    const dot = app.querySelector('.qd.cur'); if(dot) dot.classList.toggle('done', el.value.trim() !== '');
    const sub = document.getElementById('answered'); if(sub) sub.textContent = L('Отвечено ', 'Answered ') + answeredCount(S.run) + L(' из ', ' of ') + S.run.order.length; },
  ordText: el => { const q = S.draft.questions[+el.dataset.q]; const v = el.value;
    q.items = v.includes('|') ? v.split('|').map(x => x.trim()).filter(Boolean) : v.split(/\s+/).filter(Boolean);
    const pv = document.getElementById('pv-' + q.id); if(pv) pv.innerHTML = wordsPreview(q.items); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el || el.disabled || el.closest('.ov')) return; const f = ACT[el.dataset.act]; if(f) f(el, e); });
document.addEventListener('submit', e => { if(e.target.id === 'loginForm'){ e.preventDefault(); doLogin(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.inp && INP[el.dataset.inp] && el.tagName !== 'SELECT') INP[el.dataset.inp](el);
  if(el.dataset.path && S.draft && el.type !== 'radio' && el.type !== 'checkbox' && el.tagName !== 'SELECT'){
    setPath(S.draft, el.dataset.path, readVal(el));
    const sum = document.getElementById('edSum'); if(sum) sum.textContent = editorSummary();
    if(el.dataset.refresh){ const m = el.dataset.path.match(/^questions\.(\d+)\.pairs\.(\d+)/); const p = S.draft.questions[+m[1]].pairs[+m[2]];
      const th = el.parentElement.querySelector('.thumb'); if(th && !p.img) th.innerHTML = esc(p.label) || ico('img'); }
  }
  if(el.dataset.rpath && S.rdraft && el.type !== 'checkbox'){ setPath(S.rdraft, el.dataset.rpath, readVal(el)); const m = document.getElementById('rMax'); if(m) m.textContent = fmtN(roomMax(S.rdraft)); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.path && S.draft && (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT')){ setPath(S.draft, el.dataset.path, readVal(el)); if(el.dataset.rerender) render(); }
  if(el.dataset.chg === 'mc'){ const q = S.draft.questions[+el.dataset.q], j = +el.dataset.j;
    q.correct = el.checked ? [...new Set(q.correct.concat(j))].sort((a, b) => a - b) : q.correct.filter(x => x !== j); }
  if(el.dataset.rpath && S.rdraft && el.type === 'checkbox'){ setPath(S.rdraft, el.dataset.rpath, el.checked); if(el.dataset.rerender) render(); }
  if(el.dataset.chg === 'roomTest' && S.rdraft){ const ids = S.rdraft.test.testIds, id = el.dataset.id;
    S.rdraft.test.testIds = el.checked ? (ids.includes(id) ? ids : ids.concat(id)) : ids.filter(x => x !== id); }
});
document.getElementById('imgpick').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !pendingImg || !S.draft) return;
  const {q, j} = pendingImg; loadImage(f, url => { if(S.draft && S.draft.questions[q]){ S.draft.questions[q].pairs[j].img = url; render(); } });
});
document.getElementById('jsonpick').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) importFile(f); });
document.addEventListener('keydown', e => {
  const ovs = document.querySelectorAll('.ov');
  if(e.key === 'Escape' && ovs.length){ ovs[ovs.length - 1]._close(); return; }
  if(ovs.length) return;
  const el = e.target;
  if((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.act){ e.preventDefault(); el.click(); return; }
  if(S.view !== 'run' || !S.run) return;
  if(e.key === 'Enter' && el.id === 'ansInput'){ e.preventDefault(); const b = app.querySelector('.dock [data-act="nextQ"],.dock [data-act="finish"]'); if(b) b.click(); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowRight'){ moveTo(S.run.pos + 1); return; }
  if(e.key === 'ArrowLeft'){ moveTo(S.run.pos - 1); return; }
  const d = /^[1-9]$/.test(e.key) ? +e.key - 1 : -1; if(d < 0) return;
  const q = curQ();
  if(q.type === 'tf' && d < 2) ACT.aTf({dataset:{v: d === 0 ? '1' : '0'}});
  else if((q.type === 'single' || q.type === 'multi') && d < q.options.length) ACT[q.type === 'single' ? 'aSingle' : 'aMulti']({dataset:{j:String(d)}});
});

/* ---------- синхронизация между вкладками ---------- */
const LIVE = { exam:1, room:1, grade:1, scores:1, results:1, learn:1, editorList:1, result:1 };
const fieldFocused = () => { const a = document.activeElement; return !!a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio'; };
window.addEventListener('storage', e => {
  if(e.key === LS_KEY){
    const d = loadDB(); if(!d) return; D = d;
    if(ME){ const u = userById(ME.id); if(!u){ doLogout(); toast(L('Ваш аккаунт удалён', 'Your account was deleted')); return; } ME = u; }
    if(LIVE[S.view] || S.view === 'login'){ if(fieldFocused() || document.querySelector('.ov')) S.syncPending = true; else render(); }
  } else if(e.key === GA_KEY && S.view === 'grade' && !document.querySelector('.ov')) render();
});
setInterval(() => { tick(); if(S.syncPending && !fieldFocused() && !document.querySelector('.ov')) render(); }, 1000);

/* ===== СИНХРОНИЗАЦИЯ С СЕРВЕРОМ (добавлено): общая очередь, румы, студенты, баллы между устройствами =====
   Если сервера нет (файл открыт с диска) — приложение работает как раньше, только на localStorage. */
const SYNC = { on:false, last:{} };
const SYNC_COLS = ['users','tests','rooms','attempts','writings','queue','grades'];
const syncKey = x => x.id || [x.roomId, x.userId, x.testId || x.part || ''].join('|');
function syncSnapOf(db){ const o = {}; SYNC_COLS.forEach(c => { o[c] = {}; (db[c] || []).forEach(x => { o[c][syncKey(x)] = JSON.stringify(x); }); }); return o; }
const syncSig = o => JSON.stringify(Object.keys(o).sort().map(c => [c, Object.keys(o[c]).sort().map(k => o[c][k])]));
async function syncPush(){
  if(!SYNC.on) return;
  const cur = syncSnapOf(D), prev = SYNC.last, ch = {}; let any = false;
  SYNC_COLS.forEach(c => { const up = [], del = [];
    for(const k in cur[c]) if(prev[c][k] !== cur[c][k]) up.push(JSON.parse(cur[c][k]));
    for(const k in prev[c]) if(!(k in cur[c])) del.push(k);
    if(up.length || del.length){ ch[c] = { up, del }; any = true; } });
  if(!any) return;
  SYNC.last = cur;
  try{ const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ changes:ch }) }); if(!r.ok) throw 0; }
  catch(e){ SYNC.last = prev; }
}
function syncApply(db, force){
  if(!force && syncSig(syncSnapOf(db)) === syncSig(syncSnapOf(D))) return;
  const d = Object.assign({}, D); SYNC_COLS.forEach(c => { d[c] = db[c] || []; });
  D = normDB(d); SYNC.last = syncSnapOf(D);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){}
  if(ME){ const u = userById(ME.id); if(!u){ doLogout(); toast(L('Ваш аккаунт удалён', 'Your account was deleted')); return; } ME = u; }
  if(LIVE[S.view] || S.view === 'login'){ if(fieldFocused() || document.querySelector('.ov')) S.syncPending = true; else render(); }
}
async function syncStart(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch('/api/state'); if(!r.ok) return; const s = await r.json();
    SYNC.last = syncSnapOf({}); SYNC.on = true;
    if(!s.rev){ syncPush(); } else syncApply(s.db, true);
    const es = new EventSource('/api/events'); es.onmessage = e => { try{ syncApply(JSON.parse(e.data).db); }catch(x){} };
  }catch(e){}
}

/* ---------- старт ---------- */
(function init(){
  applyLang();
  D = loadDB();
  if(!D){ D = freshDB(); persist(); } // первый заход: создаются аккаунты user/1 и teacher/admin и пробный экзамен
  const sid = sesGet(); ME = sid ? userById(sid) || null : null;
  if(ME){ const pr = loadRun(); S.pendingRun = pr && testById(pr.test.id) ? pr : null; }
  let hs = null; try{ hs = history.state; }catch(e){}
  const VIEWS = ['exam','room','result','results','learn','editorList','editor','roomEditor','scores','grade'];
  if(ME && hs && VIEWS.includes(hs.view)){ S.view = hs.view; S.params = hs.params || {}; render(); return; }
  S.view = ME ? 'exam' : 'login';
  try{ history.replaceState({view:S.view, params:{}, depth:(hs && hs.depth) || 0}, ''); }catch(e){ HIST = false; }
  render();
})();
syncStart();
// доступ для автотестов
window.__edu = { S, get D(){ return D; }, get ME(){ return ME; }, grade, validateTest, validateRoom, progress, startTest, fmtT, quality, go, GA_TTL };
